spring.application.name=integrador
spring.datasource.url=jdbc:postgresql://localhost:5432/integrador
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.tomcat.max-http-form-post-size=10MB

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=integrador-api
app.security.jwt.expiration=PT2H
app.security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.enabled=true

app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.schedulers-enabled=${WHATSAPP_SCHEDULERS_ENABLED:true}
app.whatsapp.production=${WHATSAPP_PRODUCTION:false}
app.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.waba-id=${WHATSAPP_WABA_ID:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.business-number=${WHATSAPP_BUSINESS_NUMBER:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:}
app.whatsapp.test-allowed-numbers=${WHATSAPP_TEST_ALLOWED_NUMBERS:}
