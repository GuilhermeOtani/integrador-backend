spring.application.name=integrador
spring.datasource.url=jdbc:postgresql://localhost:5432/integrador
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.tomcat.max-http-form-post-size=10MB

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=integrador-api
app.security.jwt.expiration=PT2H
app.security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.enabled=true
