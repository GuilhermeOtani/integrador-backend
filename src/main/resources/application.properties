spring.application.name=integrador
spring.datasource.url=jdbc:postgresql://localhost:5432/integrador
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.tomcat.max-http-form-post-size=10MB

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=integrador-api
app.security.jwt.expiration=PT2H
app.security.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.bootstrap-admin.enabled=true

# Começa desativado. Credenciais e destinatários de teste ficam fora do repositório.
app.email.enabled=${EMAIL_ENABLED:false}
app.email.schedulers-enabled=${EMAIL_SCHEDULERS_ENABLED:true}
app.email.production=${EMAIL_PRODUCTION:false}
app.email.allowed-recipients=${EMAIL_TEST_RECIPIENTS:}
app.email.from=${EMAIL_FROM:}
app.email.smtp-host=${EMAIL_SMTP_HOST:}
app.email.smtp-port=${EMAIL_SMTP_PORT:587}
app.email.smtp-username=${EMAIL_SMTP_USERNAME:}
app.email.smtp-password=${EMAIL_SMTP_PASSWORD:}
app.email.starttls=${EMAIL_STARTTLS:true}
app.email.ssl=${EMAIL_SSL:false}
